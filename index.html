<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f7f6">
    <title>PDF Extractor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/styles.css">
    <script src="./src/app.js" defer></script>
  </head>
  <body>
    <main>
      <section class="upload" aria-labelledby="upload-title">
        <h1 id="upload-title">Carica il tuo <span>PDF.</span></h1>
        <button id="select-file" type="button">
          <img src="./assets/upload.svg" alt="" width="20" height="20">
          Seleziona file
        </button>
        <input id="file-input" type="file" accept=".pdf" hidden>
        <div class="feedback-slot">
          <p id="feedback" role="status" aria-live="polite" aria-atomic="true"></p>
        </div>
      </section>
    </main>
  </body>
</html>
